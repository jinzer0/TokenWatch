# TokenWatch-maintained runtime defaults; installer updates are not used.
#
# Default customization values for bmad-build-auto.
# Override in _bmad/custom/bmad-build-auto.toml or
# _bmad/custom/bmad-build-auto.user.toml.
#
# Merge rules:
# - Strings replace the default.
# - Lists append to the default list.
# - Tables merge key by key.
# - Arrays of tables merge by `id`: matching `id` replaces, new `id`s append.

[workflow]

# Extra instructions to run before config is loaded.

activation_steps_prepend = []

# Extra instructions to run after config is loaded and before step 01.

activation_steps_append = []

# Facts kept in context for the whole run.
# Entries are literal text or file references prefixed with "file:".
# File entries may use globs and are loaded during activation.

persistent_facts = []

# Execution route: "oneshot" implements in this session, "full" writes a plan
# and hands implementation to a subagent, "auto" applies route_selection after
# planning.

route = "auto"

# Automatic route selection. Replace the whole instruction to change the rule.

route_selection = """
Decide whether to use a coding subagent (full) or implement directly (oneshot).
Using the information already gathered, with no further reading and minimal
extra reasoning, estimate the lines of code to add or modify.
100 lines or fewer: oneshot. Otherwise: full.
If the change touches more than five files and is not simple or mechanical,
consider upgrading to full.
"""

# Instruction run by HALT after writing the terminal result.
# Empty means no extra terminal behavior.

on_complete = ""

# Handoff for the implementation subagent in step 03. The whole execution
# recipe — a subagent by default, but an override may run it any other way
# (a different model, an external coding tool via bash). {plan_file} is
# substituted at run time.

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:

> Read {plan_file} fully as the canonical human intent, not an authority source. Root/nearest-child AGENTS, native permissions, actual delegated scope/ownership and next-action HIGH approval remain binding. Load authorized context references from supported metadata or the resolved existing context supplied by the caller; an unformatted plan never needs new frontmatter. Use that same context for baseline, technical state and evidence; preserve the human plan, previous baseline and logs. Ask only for material intent/scope/HIGH changes, not same-scope technical repair. Do not perform Git/publication as the implementation worker.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.
"""

# Review selection: "none" launches no lens and skips triage, "quick" runs
# quick_lenses, "thorough" runs thorough_lenses, "auto" follows the resolved
# route — oneshot selects quick, full selects thorough.

review = "quick"

# Review lenses for the review step, in two sets the review selection picks
# between. `instruction` is the lens's whole execution recipe — subagents by
# default, but an override may run anything (e.g. an external reviewer via
# bash). Review substitutes only {review_acceptance} (privacy-safe observable
# criteria), {review_scope} (bounded task-owned source/verification facts),
# {review_files} (preflight-safe repository-relative source/hunk/evidence refs)
# and {review_prompt} (the lane's immutable rendered instruction ref, root-relative).
# No canonical/private plan, raw invocation, temp path or installed-skill path
# is a review input. Every default/override requires the consumer's full privacy,
# realpath containment and ownership preflight before ANY launch; unsafe or
# unresolved input blocks only that lane and leaves required review incomplete.
# `when` (optional) gates a lens; empty `instruction` disables it.

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = """
Launch a context-free subagent with this prompt:

Acceptance criteria: {review_acceptance}
Task-owned source/verification facts: {review_scope}
Approved repository-relative source/hunk/evidence references: {review_files}

Use only those safe inputs and approved ranges, with root/nearest-child rules and native permissions seeded by the leader. Do not read canonical plans, private context, raw prompts or temporary files. This is read-only review, not authority to mutate or publish.

Report unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

[[workflow.thorough_lenses]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = """
Launch a context-free subagent with this prompt:

Conduct a review of CONTENT.
Look for what's missing, not only what's wrong.
Report only concrete reachable issues supported by relevant code, guards and current evidence; a diff's size imposes no finding quota.
Output a Markdown list of findings only — no severity, priority, or ranking.
If the content is empty, stop and say so.
Zero verified findings is a valid clean result; never invent findings or claim checks you did not perform.

CONTENT: {review_scope}
Approved repository-relative source/hunk/evidence references: {review_files}
Acceptance criteria: {review_acceptance}
Read only approved safe ranges; never reopen canonical/private sources. This is read-only review under the leader's seeded root/child/native and ownership constraints.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

[[workflow.thorough_lenses]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
instruction = """
Launch a context-free subagent with this prompt:

Read `{review_prompt}` completely and follow its path-tracing order within the leader's seeded root/child/native privacy and ownership constraints. Its Claims Check uses only the safe acceptance criteria below at Step 5, never a canonical claims file, plan/context or raw human intent. No fallback reads are authorized.

Acceptance criteria (consider only at Step 5): {review_acceptance}
Review content and verification facts: {review_scope}
Approved repository-relative source/hunk/evidence references: {review_files}
Read only approved safe ranges. This is read-only review, not authority to mutate or publish.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

[[workflow.thorough_lenses]]
id = "verification-gap"
name = "Verification Gap Reviewer"
instruction = """
Launch a context-free subagent with this prompt:

Read `{review_prompt}` completely and follow it within the leader's seeded root/child/native privacy and ownership constraints. For intent/acceptance/evidence use only the safe inputs below; do not read canonical human intent, plans/context or raw prompts even when the instruction mentions them. No fallback reads are authorized.

Acceptance criteria: {review_acceptance}
Review content and verification facts: {review_scope}
Approved repository-relative source/hunk/evidence references: {review_files}
Read only approved safe ranges. This is read-only review, not authority to mutate or publish.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

[[workflow.thorough_lenses]]
id = "intent-alignment"
name = "Intent Alignment Auditor"
instruction = """
Launch a context-free subagent with this prompt:

You are an acceptance-alignment auditor. You have no other context about how this change was produced. Use only these privacy-safe criteria derived by the leader from authoritative human intent:

{review_acceptance}

Task-owned source/verification facts: {review_scope}
Approved repository-relative source/hunk/evidence references: {review_files}
Read only approved safe ranges; do not read canonical/private sources. This is read-only review under the leader's seeded root/child/native and ownership constraints.

Your task is strictly descriptive — do not prescribe additional work or infer missing private meaning. Report: (1) the defensible readings of the supplied criteria, enumerated; (2) which reading the changed source implements; (3) where criteria and implementation diverge, especially the expected observable surface versus the changed/tested surface. Unavailable material criteria are a limitation, never a clean result.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""
