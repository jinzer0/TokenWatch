name: Hyper-Waterfall 작업
description: 다음 AI 작업 프롬프트로 사용할 추적 작업을 등록합니다.
title: '작업: '
body:
  - type: markdown
    attributes:
      value: |
        이 서식으로 Hyper-Waterfall 작업 Issue를 작성합니다.
        Issue 본문은 다음 AI 작업 세션의 첫 프롬프트가 되므로 의도와 제약을 명확하게 적어 주세요.

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 작업이 필요한 이유, 현재 상태의 문제, 작업을 시작하게 된 맥락을 설명해 주세요.
      placeholder: |
        예시:
        - 현재 구조의 한계
        - 이전 PR, Issue 또는 문서에서 이어지는 이유
        - 사용자 요청 또는 외부 요구사항
    validations:
      required: true

  - type: textarea
    id: goals
    attributes:
      label: 목표
      description: 작업 완료 시 반드시 달성해야 할 결과를 나열해 주세요.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: included_scope
    attributes:
      label: 범위 - 포함
      description: 이 작업에 포함할 파일, 기능, 문서, 검증 영역을 나열해 주세요.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: excluded_scope
    attributes:
      label: 범위 - 제외
      description: 이 작업에서 명시적으로 제외할 항목을 나열해 주세요.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 인수 기준
      description: 작업 완료 여부를 판단할 관찰 가능한 기준을 적어 주세요.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 검증 기준
      description: 수행해야 할 테스트, grep 검사, 수동 확인 또는 리뷰 기준을 나열해 주세요.
      placeholder: |
        - `git diff --check`
        - ...
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 Issue, PR, 문서, 공식 가이드 또는 외부 자료를 나열해 주세요.
      placeholder: |
        - #...
        - https://...
    validations:
      required: false

  - type: textarea
    id: metadata
    attributes:
      label: 마일스톤 및 라벨 후보
      description: 마일스톤과 라벨 후보 및 적합한 이유를 적어 주세요. 최종 선택은 task-register의 실시간 조회 결과를 따릅니다.
      placeholder: |
        - 마일스톤 후보:
        - 라벨 후보:
        - 선택 이유:
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 확인 사항
      description: 중복 작업과 범위 충돌을 줄이기 위해 다음 항목을 확인해 주세요.
      options:
        - label: 기존 열린 Issue와 중복되지 않음을 확인했습니다.
          required: true
        - label: 이 작업에서 제외하는 항목을 명시했습니다.
          required: true
        - label: 명확한 LOW/MEDIUM scope는 별도 계획 승인 없이 진행하며, HIGH 위험 행동 직전에만 대상·행위·영향·복구 조건에 맞는 명시 승인을 확인합니다.
          required: true
