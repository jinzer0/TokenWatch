name: Linux AppImage validation
on:
  pull_request:
    paths:
      - '.github/workflows/linux-build-smoke.yml'
      - '.github/workflows/release-candidate.yml'
      - 'electron-builder.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'patches/**'
      - 'src/desktop/**'
      - 'tests/desktop/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-build-smoke:
    name: Sandboxed AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            script: package:linux:x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            script: package:linux:arm64
    env:
      TOKENWATCH_DB_PATH: /tmp/tokenwatch-linux-ci.db
      TOKENWATCH_DESKTOP_SMOKE_MARKER_PATH: /tmp/tokenwatch-linux-ci-marker
      XDG_CONFIG_HOME: /tmp/tokenwatch-linux-ci-config
      XDG_CACHE_HOME: /tmp/tokenwatch-linux-ci-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify launcher sandbox and checksum regressions
        run: corepack pnpm test tests/desktop/appImageSandbox.test.ts tests/desktop/writeSha256.test.ts tests/desktop/verifyLinuxAppImage.test.ts
      - name: Build and verify the real AppImage
        run: xvfb-run --auto-servernum corepack pnpm ${{ matrix.script }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokenwatch-linux-smoke-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 7
